<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MTG Deck Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
        background: #101417;
        color: #f0f3f4;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(ellipse at 85% -10%, #27393b 0, transparent 38rem),
          #101417;
      }

      main {
        width: min(1280px, 100%);
        margin: 0 auto;
        padding: 40px 24px 64px;
      }

      h1, h2, p { margin-top: 0; }
      h1 { margin-bottom: 8px; font-size: clamp(1.8rem, 5vw, 2.8rem); }
      h2 { margin: 30px 0 16px; font-size: 1.25rem; }
      .type-heading { margin: 24px 0 12px; font-size: 1.05rem; }
      .intro, .help { color: #aeb9bb; }
      .panel > label.help { display: block; margin-bottom: 8px; }
      .panel {
        margin-top: 28px;
        padding: 20px;
        border: 1px solid #354144;
        border-radius: 14px;
        background: #191f22e8;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 220px;
        padding: 14px;
        resize: vertical;
        border: 1px solid #4a5759;
        border-radius: 8px;
        background: #0e1214;
        color: inherit;
        font: 15px/1.6 Consolas, "Cascadia Code", monospace;
      }

      .edit-menu {
        position: fixed;
        z-index: 10;
        min-width: 150px;
        padding: 4px;
        border: 1px solid #526164;
        border-radius: 8px;
        background: #222c2f;
        box-shadow: 0 4px 16px #0008;
      }
      .edit-menu[hidden] { display: none; }
      .edit-menu button {
        display: block;
        width: 100%;
        min-height: 34px;
        border: 0;
        text-align: left;
      }

      button, .file-button {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border: 1px solid #526164;
        border-radius: 8px;
        background: #222c2f;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      button:hover, .file-button:hover { background: #2e3b3e; }
      button[aria-pressed="true"] { border-color: #42b999; background: #18866b; }
      button:focus-visible, .file-button:focus-within, textarea:focus-visible {
        outline: 2px solid #70d7bd;
        outline-offset: 2px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .primary {
        border-color: #42b999;
        background: #18866b;
        font-weight: 700;
      }
      .primary:hover { background: #209a7b; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .file-button input { position: absolute; width: 1px; height: 1px; opacity: 0; }
      .status { min-height: 1.5em; margin: 16px 0 0; color: #aeb9bb; }
      .status.error { color: #ff9a94; }
      .status.success { color: #8fe1c8; }
      .section-count { color: #9eabad; font-size: 0.9rem; font-weight: 400; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        column-gap: 18px;
        row-gap: 0;
        padding-bottom: var(--card-overlap, 0px);
      }

      .card {
        overflow: hidden;
        margin-bottom: calc(var(--card-overlap, 0px) * -1);
        border: 1px solid #344044;
        border-radius: 12px;
        background: #191f22;
      }

      .image-wrap { position: relative; min-height: 100px; background: #222a2d; }
      .card-image {
        display: block;
        width: 100%;
        aspect-ratio: 488 / 680;
        object-fit: cover;
      }

      .no-image {
        display: grid;
        min-height: 180px;
        place-items: center;
        padding: 18px;
        color: #c5cfce;
        text-align: center;
      }

      .quantity {
        position: absolute;
        top: 9px;
        left: 9px;
        padding: 5px 9px;
        border: 1px solid #ffffff50;
        border-radius: 999px;
        background: #101417eF;
        font-weight: 700;
      }

      .card-body { padding: 12px; }
      .card-name { margin-bottom: 5px; font-size: 1rem; font-weight: 700; }
      .card-with-image .card-name, .card-with-image .card-set,
      .card-with-image .card-type { display: none; }
      .card-link { color: inherit; }
      .card-link:hover { color: #8fe1c8; }
      .card-link:focus-visible { outline: 2px solid #70d7bd; outline-offset: -2px; }
      .card-set, .card-type { margin-bottom: 4px; color: #aeb9bb; font-size: 0.85rem; }
      .card-error { color: #ff9a94; }
      .empty { color: #9eabad; }

      @media (max-width: 520px) {
        main { padding: 28px 14px 48px; }
        .panel { padding: 14px; }
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          column-gap: 12px;
          row-gap: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MTG Deck Viewer</h1>
      <p class="intro">デッキリストを読み込み、カード画像を一覧表示します。</p>

      <section class="panel" aria-labelledby="input-heading">
        <h2 id="input-heading">デッキリスト</h2>
        <label class="help" for="decklist">MTGAのエクスポート形式や、1行に1種類のリストに対応。例：<code>4 Lightning Bolt</code></label>
        <textarea id="decklist" spellcheck="false" placeholder="4 Lightning Bolt&#10;2 Island&#10;&#10;Sideboard&#10;2 Negate"></textarea>
        <div id="edit-menu" class="edit-menu" role="menu" aria-label="テキスト編集" hidden>
          <button type="button" role="menuitem" data-action="cut">切り取り</button>
          <button type="button" role="menuitem" data-action="copy">コピー</button>
          <button type="button" role="menuitem" data-action="paste">貼り付け</button>
        </div>
        <div class="actions">
          <label class="file-button">テキストファイルを選択
            <input id="file-input" type="file" accept=".txt,text/plain">
          </label>
          <button id="clear-button" type="button">デッキリストをクリア</button>
          <button id="search-button" class="primary" type="button">カード画像を表示</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <div class="actions">
        <button id="export-button" type="button" disabled>検索結果をPNGで保存</button>
        <button id="visual-export-button" type="button" disabled>簡易表示をPNGで保存</button>
        <button id="preview-button" type="button">カードプレビューを別ウィンドウで開く</button>
      </div>
      <div class="actions" role="group" aria-label="検索結果の表示言語">
        <span class="help">検索結果の言語:</span>
        <button id="english-button" type="button" aria-pressed="true" disabled>English</button>
        <button id="japanese-button" type="button" aria-pressed="false" disabled>日本語</button>
      </div>
      <p id="language-status" class="status" role="status" aria-live="polite"></p>
      <p id="export-status" class="status" role="status" aria-live="polite"></p>
      <p id="preview-status" class="status" role="status" aria-live="polite"></p>
      <div id="results"></div>
    </main>
    <script>
      const decklist = document.querySelector("#decklist");
      const fileInput = document.querySelector("#file-input");
      const status = document.querySelector("#status");
      const results = document.querySelector("#results");
      const searchButton = document.querySelector("#search-button");
      const exportButton = document.querySelector("#export-button");
      const visualExportButton = document.querySelector("#visual-export-button");
      const previewButton = document.querySelector("#preview-button");
      const exportStatus = document.querySelector("#export-status");
      const previewStatus = document.querySelector("#preview-status");
      const PREVIEW_CLICK_DELAY = 550;
      const englishButton = document.querySelector("#english-button");
      const japaneseButton = document.querySelector("#japanese-button");
      const languageStatus = document.querySelector("#language-status");
      let currentCards = [];
      let japaneseCards = {};
      let currentLanguage = "en";
      let japaneseCardsLoaded = false;
      let fileReadVersion = 0;
      let previewWindow = null;
      let nativePreviewOpen = false;
      let previewUpdates = Promise.resolve();
      let hoveredCard = null;
      let pinnedPreviewKey = null;
      let pendingPreviewClick = null;

      window.addEventListener("pywebviewready", () => {
        const menu = document.querySelector("#edit-menu");
        let selectionStart = 0;
        let selectionEnd = 0;

        decklist.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          selectionStart = decklist.selectionStart;
          selectionEnd = decklist.selectionEnd;
          menu.querySelector('[data-action="cut"]').disabled = selectionStart === selectionEnd;
          menu.querySelector('[data-action="copy"]').disabled = selectionStart === selectionEnd;
          menu.hidden = false;
          const bounds = menu.getBoundingClientRect();
          menu.style.left = `${Math.max(0, Math.min(event.clientX, window.innerWidth - bounds.width))}px`;
          menu.style.top = `${Math.max(0, Math.min(event.clientY, window.innerHeight - bounds.height))}px`;
        });

        menu.addEventListener("mousedown", (event) => event.preventDefault());
        menu.addEventListener("click", async (event) => {
          const action = event.target.closest("button")?.dataset.action;
          if (!action) return;
          menu.hidden = true;
          try {
            const originalText = decklist.value;
            if (action === "copy" || action === "cut") {
              await window.pywebview.api.write_clipboard(originalText.slice(selectionStart, selectionEnd));
            }
            if (action === "cut" || action === "paste") {
              const text = action === "paste" ? await window.pywebview.api.read_clipboard() : "";
              if (decklist.value !== originalText) throw new Error("編集中に入力内容が変更されました。");
              decklist.focus();
              decklist.setSelectionRange(selectionStart, selectionEnd);
              if (!document.execCommand("insertText", false, text)) {
                throw new Error("テキストを編集できませんでした。");
              }
            }
          } catch (error) {
            status.className = "status error";
            status.textContent = `クリップボードを操作できませんでした: ${error.message || error}`;
          }
        });
        document.addEventListener("pointerdown", (event) => {
          if (!menu.contains(event.target)) menu.hidden = true;
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") menu.hidden = true;
        });
      });

      previewButton.addEventListener("click", async () => {
        if (window.pywebview?.api) {
          previewButton.disabled = true;
          try {
            await window.pywebview.api.open_preview();
            nativePreviewOpen = true;
            previewStatus.className = "status";
            previewStatus.textContent = "カードをクリックするとプレビューを固定します。ダブルクリックでScryfallを開きます。";
            sendCardPreview();
          } catch (error) {
            previewStatus.className = "status error";
            previewStatus.textContent = `プレビューウィンドウを開けませんでした: ${error.message || error}`;
          } finally {
            previewButton.disabled = false;
          }
          return;
        }
        if (previewWindow && !previewWindow.closed) {
          previewWindow.focus();
          return;
        }
        previewWindow = window.open(
          "/preview",
          "mtg-card-preview",
          "popup,width=360,height=502,resizable=no"
        );
        if (!previewWindow) {
          previewStatus.className = "status error";
          previewStatus.textContent = "プレビューウィンドウを開けませんでした。ポップアップを許可してください。";
          return;
        }
        previewStatus.className = "status";
        previewStatus.textContent = "カードをクリックするとプレビューを固定します。ダブルクリックでScryfallを開きます。";
      });

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin || event.source !== previewWindow) return;
        if (event.data?.type === "card-preview-ready") sendCardPreview();
      });

      results.addEventListener("pointerover", (event) => {
        const card = event.target.closest(".card");
        if (pinnedPreviewKey !== null || !card || (event.relatedTarget instanceof Node && card.contains(event.relatedTarget))) return;
        hoveredCard = card;
        sendCardPreview();
      });

      results.addEventListener("click", (event) => {
        const card = event.target.closest(".card");
        if (!card) return;
        if (event.target.closest(".card-link")) event.preventDefault();
        const key = card.dataset.previewKey;

        if (pendingPreviewClick) {
          clearTimeout(pendingPreviewClick.timer);
          pendingPreviewClick = null;
          if (event.detail > 1 && pinnedPreviewKey === key) return;
        } else if (event.detail > 1 && pinnedPreviewKey === key) {
          return;
        }

        hoveredCard = card;
        sendCardPreview();
        if (pinnedPreviewKey === key) {
          const timer = setTimeout(() => {
            if (pinnedPreviewKey === key) pinnedPreviewKey = null;
            pendingPreviewClick = null;
          }, PREVIEW_CLICK_DELAY);
          pendingPreviewClick = { key, timer };
        } else {
          pinnedPreviewKey = key;
        }
      });

      results.addEventListener("dblclick", (event) => {
        event.preventDefault();
        if (pendingPreviewClick) {
          clearTimeout(pendingPreviewClick.timer);
          pendingPreviewClick = null;
        }
        const card = event.target.closest(".card");
        const link = card?.querySelector(".card-link");
        const url = scryfallUrl(link?.href);
        if (url) window.open(url, "_blank", "noopener,noreferrer");
      });

      function sendCardPreview() {
        if (!hoveredCard) return;
        const image = hoveredCard.querySelector(".card-image");
        const name = hoveredCard.querySelector(".card-name")?.textContent.trim() || image?.alt || "カード";
        const imageUrl = image?.src || "";
        if (nativePreviewOpen) {
          previewUpdates = previewUpdates.then(async () => {
            if (!nativePreviewOpen) return;
            nativePreviewOpen = await window.pywebview.api.update_preview(name, imageUrl);
          }).catch((error) => {
            previewStatus.className = "status error";
            previewStatus.textContent = `カードをプレビューできませんでした: ${error.message || error}`;
          });
          return;
        }
        if (!previewWindow || previewWindow.closed) return;
        previewWindow.postMessage({
          type: "card-preview",
          card: { name, imageUrl },
        }, window.location.origin);
      }

      window.addEventListener("resize", () => {
        for (const grid of results.querySelectorAll(".grid")) updateGridOverlap(grid);
      });

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files?.[0];
        if (!file) return;
        const version = ++fileReadVersion;
        try {
          const text = await file.text();
          if (version !== fileReadVersion) return;
          decklist.value = text;
          status.className = "status";
          status.textContent = `${file.name} を読み込みました。`;
        } catch (error) {
          if (version !== fileReadVersion) return;
          status.className = "status error";
          status.textContent = `ファイルを読み込めませんでした: ${error.message}`;
        }
      });

      document.querySelector("#clear-button").addEventListener("click", () => {
        fileReadVersion++;
        fileInput.value = "";
        decklist.value = "";
        decklist.focus();
        if (!searchButton.disabled) {
          status.className = "status";
          status.textContent = "デッキリストをクリアしました。検索結果は残っています。";
        }
      });

      searchButton.addEventListener("click", async () => {
        searchButton.disabled = true;
        exportButton.disabled = true;
        visualExportButton.disabled = true;
        englishButton.disabled = true;
        japaneseButton.disabled = true;
        currentCards = [];
        japaneseCards = {};
        japaneseCardsLoaded = false;
        currentLanguage = "en";
        pinnedPreviewKey = null;
        if (pendingPreviewClick) clearTimeout(pendingPreviewClick.timer);
        pendingPreviewClick = null;
        hoveredCard = null;
        englishButton.setAttribute("aria-pressed", "true");
        japaneseButton.setAttribute("aria-pressed", "false");
        languageStatus.textContent = "";
        exportStatus.textContent = "";
        results.replaceChildren();
        status.className = "status";
        status.textContent = "カード情報を検索しています…";

        try {
          const response = await fetch("/api/deck", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: decklist.value }),
          });
          const payload = await response.json();
          if (!response.ok) {
            if (response.status === 429) {
              throw new Error("Scryfallの検索制限に達しました。60秒ほど待ってから再試行してください。");
            }
            throw new Error(payload.error || `HTTP ${response.status}`);
          }
          currentCards = payload.cards;
          renderCards(currentCards);
          exportButton.disabled = !payload.cards.length;
          visualExportButton.disabled = !payload.cards.length;
          englishButton.disabled = !payload.cards.length;
          japaneseButton.disabled = !payload.cards.length;
          const missing = payload.cards.filter((entry) => !entry.card).length;
          status.className = missing ? "status error" : "status success";
          status.textContent = missing
            ? `${payload.cards.length}種類を処理しました。${missing}種類は見つかりませんでした。`
            : `${payload.cards.length}種類のカードを表示しました。`;
        } catch (error) {
          status.className = "status error";
          status.textContent = `検索に失敗しました: ${error.message}`;
        } finally {
          searchButton.disabled = false;
        }
      });

      englishButton.addEventListener("click", () => {
        currentLanguage = "en";
        updateLanguageButtons();
        languageStatus.textContent = "";
        renderCards(currentCards);
      });

      japaneseButton.addEventListener("click", async () => {
        japaneseButton.disabled = true;
        englishButton.disabled = true;
        searchButton.disabled = true;
        exportButton.disabled = true;
        visualExportButton.disabled = true;
        languageStatus.className = "status";
        languageStatus.textContent = "日本語のカード情報を取得しています…";
        try {
          if (!japaneseCardsLoaded) {
            const oracleIds = [...new Set(
              currentCards.map((entry) => entry.card?.oracle_id).filter(Boolean)
            )];
            const response = await fetch("/api/translations", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ oracle_ids: oracleIds }),
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
            if (!payload.translations || typeof payload.translations !== "object") {
              throw new Error("翻訳データの形式が正しくありません。");
            }
            japaneseCards = payload.translations;
            japaneseCardsLoaded = true;
          }
          currentLanguage = "ja";
          updateLanguageButtons();
          renderCards(currentCards);
          const translatedCount = Object.keys(japaneseCards).length;
          languageStatus.className = translatedCount ? "status" : "status error";
          languageStatus.textContent = translatedCount
            ? "日本語版があるカードは日本語で表示します。"
            : "日本語版のカード情報が見つかりませんでした。";
        } catch (error) {
          languageStatus.className = "status error";
          languageStatus.textContent = `日本語情報を取得できませんでした: ${error.message || error}`;
        } finally {
          englishButton.disabled = !currentCards.length;
          japaneseButton.disabled = !currentCards.length;
          searchButton.disabled = false;
          exportButton.disabled = !results.querySelector(".card");
          visualExportButton.disabled = !results.querySelector(".card");
        }
      });

      function updateLanguageButtons() {
        englishButton.setAttribute("aria-pressed", String(currentLanguage === "en"));
        japaneseButton.setAttribute("aria-pressed", String(currentLanguage === "ja"));
      }

      exportButton.addEventListener("click", () => saveResultsPng(false));
      visualExportButton.addEventListener("click", () => saveResultsPng(true));

      async function saveResultsPng(visual) {
        exportButton.disabled = true;
        visualExportButton.disabled = true;
        searchButton.disabled = true;
        englishButton.disabled = true;
        japaneseButton.disabled = true;
        exportStatus.className = "status";
        exportStatus.textContent = "PNG画像を作成しています…";
        try {
          const blob = visual ? await createVisualResultsPng() : await createResultsPng();
          const url = URL.createObjectURL(blob);
          const download = document.createElement("a");
          download.href = url;
          download.download = visual ? "mtg-deck-visual.png" : "mtg-deck.png";
          document.body.append(download);
          download.click();
          download.remove();
          setTimeout(() => URL.revokeObjectURL(url), 60000);
          exportStatus.className = "status success";
          exportStatus.textContent = "PNG画像のダウンロードを開始しました。";
        } catch (error) {
          exportStatus.className = "status error";
          exportStatus.textContent = `画像を保存できませんでした: ${error.message}`;
        } finally {
          exportButton.disabled = !results.querySelector(".card");
          visualExportButton.disabled = !results.querySelector(".card");
          searchButton.disabled = false;
          englishButton.disabled = !currentCards.length;
          japaneseButton.disabled = !currentCards.length;
        }
      }

      function visualTextRuns(element, origin) {
        const runs = [];
        const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
        const range = document.createRange();
        while (walker.nextNode()) {
          const node = walker.currentNode;
          const style = getComputedStyle(node.parentElement);
          let offset = 0;
          for (const character of node.data) {
            range.setStart(node, offset);
            offset += character.length;
            range.setEnd(node, offset);
            const rect = range.getBoundingClientRect();
            if (rect.width && rect.height && character.trim()) {
              runs.push({
                text: character,
                x: rect.left - origin.left,
                y: rect.top - origin.top,
                font: style.font,
                color: style.color,
              });
            }
          }
        }
        return runs;
      }

      async function createVisualResultsPng() {
        const origin = results.getBoundingClientRect();
        const margin = 24;
        const width = Math.ceil(origin.width) + margin * 2;
        const height = Math.ceil(origin.height) + margin * 2;
        const elements = [...results.querySelectorAll("h2, h3, .card")].map((element) => {
          const card = element.classList.contains("card");
          const image = card ? element.querySelector(".card-image") : null;
          const imageWrap = card ? element.querySelector(".image-wrap") : null;
          const quantity = card ? element.querySelector(".quantity") : null;
          const relativeRect = (target) => {
            const box = target.getBoundingClientRect();
            return { x: box.left - origin.left, y: box.top - origin.top, width: box.width, height: box.height };
          };
          return {
            card,
            box: relativeRect(element),
            imageBox: image ? relativeRect(image) : null,
            wrapBox: imageWrap ? relativeRect(imageWrap) : null,
            quantityBox: quantity ? relativeRect(quantity) : null,
            name: card ? element.querySelector(".card-name").textContent : "",
            imageUrl: image?.src,
            texts: visualTextRuns(element, origin),
          };
        });
        const cards = elements.filter((element) => element.card);
        if (!cards.length) throw new Error("保存する検索結果がありません。");
        if (width > 32767 || height > 32767 || width * height > 40000000) {
          throw new Error("検索結果が大きすぎて1枚のPNGに保存できません。");
        }
        await loadExportImages(cards);
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("このブラウザーでは画像を作成できません。");
        context.fillStyle = "#101417";
        context.fillRect(0, 0, width, height);
        context.translate(margin, margin);

        for (const element of elements) {
          if (element.card) {
            const { x, y, width: cardWidth, height: cardHeight } = element.box;
            context.save();
            context.beginPath();
            context.roundRect(x, y, cardWidth, cardHeight, 12);
            context.clip();
            context.fillStyle = "#344044";
            context.fillRect(x, y, cardWidth, cardHeight);
            context.fillStyle = "#191f22";
            context.fillRect(x + 1, y + 1, cardWidth - 2, cardHeight - 2);
            const wrap = element.wrapBox;
            context.fillStyle = "#222a2d";
            context.fillRect(wrap.x, wrap.y, wrap.width, wrap.height);
            if (element.image) {
              const box = element.imageBox;
              const scale = Math.max(box.width / element.image.naturalWidth, box.height / element.image.naturalHeight);
              const imageWidth = element.image.naturalWidth * scale;
              const imageHeight = element.image.naturalHeight * scale;
              context.save();
              context.beginPath();
              context.rect(box.x, box.y, box.width, box.height);
              context.clip();
              context.drawImage(element.image, box.x + (box.width - imageWidth) / 2, box.y + (box.height - imageHeight) / 2, imageWidth, imageHeight);
              context.restore();
            }
            const badge = element.quantityBox;
            context.beginPath();
            context.roundRect(badge.x, badge.y, badge.width, badge.height, badge.height / 2);
            context.fillStyle = "#101417ef";
            context.fill();
            context.strokeStyle = "#ffffff50";
            context.stroke();
          }
          context.textBaseline = "top";
          for (const run of element.texts) {
            context.fillStyle = run.color;
            context.font = run.font;
            context.fillText(run.text, run.x, run.y);
          }
          if (element.card) context.restore();
        }
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("PNG画像を生成できませんでした。"));
          }, "image/png");
        });
      }

      function wrapCanvasText(context, text, maxWidth) {
        const lines = [];
        for (const paragraph of text.split("\n")) {
          let line = "";
          for (const character of paragraph) {
            if (line && context.measureText(line + character).width > maxWidth) {
              lines.push(line.trimEnd());
              line = character.trimStart();
            } else {
              line += character;
            }
          }
          if (line) lines.push(line);
        }
        return lines;
      }

      async function loadExportImages(cards) {
        let next = 0;
        async function worker() {
          while (next < cards.length) {
            const card = cards[next++];
            if (!card.imageUrl) continue;
            const image = new Image();
            image.crossOrigin = "anonymous";
            image.src = card.imageUrl;
            try {
              await image.decode();
            } catch (error) {
              throw new Error(`「${card.name}」の画像を読み込めませんでした。通信状態を確認してください。`);
            }
            card.image = image;
          }
        }
        await Promise.all(Array.from({ length: Math.min(6, cards.length) }, worker));
      }

      async function createResultsPng() {
        const sections = [...results.querySelectorAll(":scope > section")].map((section) => ({
          heading: section.querySelector("h2").textContent,
          groups: [...section.querySelectorAll(":scope > h3")].map((heading) => ({
            heading: heading.textContent,
            cards: [...heading.nextElementSibling.querySelectorAll(".card")].map((card) => ({
              name: card.querySelector(".card-name").textContent,
              quantity: card.querySelector(".quantity").textContent,
              imageUrl: card.querySelector(".card-image")?.src,
              details: [...card.querySelectorAll(".card-error")]
                .map((element) => element.textContent).filter(Boolean),
            })),
          })),
        }));
        const allCards = sections.flatMap((section) => section.groups.flatMap((group) => group.cards));
        if (!allCards.length) throw new Error("保存する検索結果がありません。");

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        if (!context) throw new Error("このブラウザーでは画像を作成できません。");
        const columns = 5;
        const cardWidth = 180;
        const imageHeight = 251;
        const gap = 16;
        const margin = 24;
        const width = margin * 2 + columns * cardWidth + (columns - 1) * gap;
        let height = 60;
        const rows = [];
        for (const section of sections) {
          rows.push({ kind: "section", y: height, text: section.heading });
          height += 40;
          for (const group of section.groups) {
            rows.push({ kind: "group", y: height, text: group.heading });
            height += 34;
            for (let offset = 0; offset < group.cards.length; offset += columns) {
              const rowCards = group.cards.slice(offset, offset + columns);
              let maxLines = 0;
              for (const card of rowCards) {
                context.font = "bold 15px sans-serif";
                card.nameLines = card.imageUrl ? [] : wrapCanvasText(context, card.name, cardWidth - 20);
                context.font = "13px sans-serif";
                card.detailLines = card.details.flatMap((text) => wrapCanvasText(context, text, cardWidth - 20));
                maxLines = Math.max(maxLines, card.nameLines.length + card.detailLines.length);
              }
              const rowHeight = imageHeight + (maxLines ? 12 + maxLines * 19 : 0);
              rows.push({ kind: "cards", y: height, cards: rowCards, height: rowHeight });
              height += rowHeight + gap;
            }
          }
        }
        height += margin;
        if (height > 32767 || width * height > 40000000) {
          throw new Error("検索結果が大きすぎて1枚のPNGに保存できません。");
        }

        await loadExportImages(allCards);
        canvas.width = width;
        canvas.height = height;
        context.fillStyle = "#101417";
        context.fillRect(0, 0, width, height);
        context.fillStyle = "#f0f3f4";
        context.font = "bold 26px sans-serif";
        context.fillText("MTG Deck Viewer", margin, 36);
        for (const row of rows) {
          if (row.kind !== "cards") {
            context.fillStyle = "#f0f3f4";
            context.font = row.kind === "section" ? "bold 21px sans-serif" : "bold 17px sans-serif";
            context.fillText(row.text, margin, row.y + 23);
            continue;
          }
          row.cards.forEach((card, index) => {
            const x = margin + index * (cardWidth + gap);
            context.fillStyle = "#191f22";
            context.fillRect(x, row.y, cardWidth, row.height);
            if (card.image) {
              const scale = Math.min(cardWidth / card.image.naturalWidth, imageHeight / card.image.naturalHeight);
              const imageWidth = card.image.naturalWidth * scale;
              const imageHeightScaled = card.image.naturalHeight * scale;
              context.drawImage(card.image, x + (cardWidth - imageWidth) / 2, row.y + (imageHeight - imageHeightScaled) / 2, imageWidth, imageHeightScaled);
            } else {
              context.fillStyle = "#aeb9bb";
              context.font = "14px sans-serif";
              context.fillText("画像がありません", x + 12, row.y + imageHeight / 2);
            }
            context.font = "bold 15px sans-serif";
            context.fillStyle = "#101417";
            context.fillRect(x + 6, row.y + 6, context.measureText(card.quantity).width + 20, 25);
            context.fillStyle = "#8fe1c8";
            context.fillText(card.quantity, x + 12, row.y + 24);
            let textY = row.y + imageHeight + 12;
            context.fillStyle = "#f0f3f4";
            for (const line of card.nameLines) {
              textY += 19;
              context.fillText(line, x + 10, textY);
            }
            context.fillStyle = "#aeb9bb";
            context.font = "13px sans-serif";
            for (const line of card.detailLines) {
              textY += 19;
              context.fillText(line, x + 10, textY);
            }
          });
        }
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("PNG画像を生成できませんでした。"));
          }, "image/png");
        });
      }

      function cardTypeOrder(typeLine) {
        if (!typeLine?.trim()) return 8;
        const types = typeLine.split("//").flatMap(
          (face) => face.split("—", 1)[0].trim().toLowerCase().split(/\s+/)
        );
        if (types.includes("land")) return 6;
        if (types.includes("creature")) return 1;
        const order = ["planeswalker", "creature", "sorcery", "instant", "artifact", "enchantment", "land"];
        const index = order.findIndex((type) => types.includes(type));
        return index === -1 ? 7 : index;
      }

      function renderCards(cards) {
        results.replaceChildren();
        const sections = [...new Set(cards.map((entry) => entry.section))];
        const typeLabels = currentLanguage === "ja" ? [
          "プレインズウォーカー", "クリーチャー", "ソーサリー", "インスタント",
          "アーティファクト", "エンチャント", "土地", "その他", "タイプ不明",
        ] : [
          "Planeswalker", "Creature", "Sorcery", "Instant",
          "Artifact", "Enchantment", "Land", "Other", "Unknown type",
        ];
        const sectionLabels = currentLanguage === "ja" ? {
          Mainboard: "メインボード",
          Sideboard: "サイドボード",
          Commander: "統率者",
          Companion: "相棒",
        } : {
          Mainboard: "Mainboard",
          Sideboard: "Sideboard",
          Commander: "Commander",
          Companion: "Companion",
        };
        const countSuffix = currentLanguage === "ja" ? "枚" : " cards";
        for (const sectionName of sections) {
          const sectionCards = cards.filter((entry) => entry.section === sectionName);
          if (!sectionCards.length) continue;
          sectionCards.sort((a, b) => cardTypeOrder(a.card?.type) - cardTypeOrder(b.card?.type));

          const section = document.createElement("section");
          const heading = document.createElement("h2");
          heading.textContent = sectionLabels[sectionName] || sectionName;
          const count = document.createElement("span");
          count.className = "section-count";
          const sectionQuantity = sectionCards.reduce((sum, entry) => sum + entry.quantity, 0);
          count.textContent = currentLanguage === "ja"
            ? `（${sectionQuantity}${countSuffix}）`
            : ` (${sectionQuantity}${countSuffix})`;
          heading.append(count);

          section.append(heading);
          for (let typeIndex = 0; typeIndex < typeLabels.length; typeIndex++) {
            const typeCards = sectionCards.filter((entry) => cardTypeOrder(entry.card?.type) === typeIndex);
            if (!typeCards.length) continue;

            const typeHeading = document.createElement("h3");
            typeHeading.className = "type-heading";
            typeHeading.textContent = typeLabels[typeIndex];
            const typeCount = document.createElement("span");
            typeCount.className = "section-count";
            const typeQuantity = typeCards.reduce((sum, entry) => sum + entry.quantity, 0);
            typeCount.textContent = currentLanguage === "ja"
              ? `（${typeQuantity}${countSuffix}）`
              : ` (${typeQuantity}${countSuffix})`;
            typeHeading.append(typeCount);

            const grid = document.createElement("div");
            grid.className = "grid";
            for (const entry of typeCards) {
              const translation = japaneseCards[entry.card?.oracle_id];
              grid.append(createCard(entry, currentLanguage === "ja" ? translation : null));
            }
            section.append(typeHeading, grid);
          }
          results.append(section);
          for (const grid of section.querySelectorAll(".grid")) updateGridOverlap(grid);
        }
      }

      function updateGridOverlap(grid) {
        const firstCard = grid.querySelector(".card");
        if (!firstCard) return;
        const image = firstCard.querySelector(".card-image");
        const height = image?.getBoundingClientRect().height || firstCard.getBoundingClientRect().height;
        grid.style.setProperty("--card-overlap", `${height / 2}px`);
      }

      function createCard(entry, translation) {
        const card = document.createElement("article");
        card.className = "card";
        card.dataset.previewKey = `${entry.section}:${entry.line}`;
        const displayCard = translation
          ? { ...entry.card, ...translation, image_url: translation.image_url || entry.card?.image_url }
          : entry.card;
        if (displayCard?.image_url) card.classList.add("card-with-image");
        const url = scryfallUrl(entry.card?.scryfall_url);
        const imageWrap = document.createElement("div");
        imageWrap.className = "image-wrap";
        const quantity = document.createElement("span");
        quantity.className = "quantity";
        quantity.textContent = `×${entry.quantity}`;
        imageWrap.append(quantity);

        if (displayCard?.image_url) {
          const image = document.createElement("img");
          image.className = "card-image";
          image.src = displayCard.image_url;
          image.alt = displayCard.name || entry.name;
          image.loading = "lazy";
          if (url) {
            const imageLink = createScryfallLink(url);
            imageLink.setAttribute("aria-label", `${image.alt} をScryfallで開く（新しいタブ）`);
            imageLink.append(image);
            imageWrap.prepend(imageLink);
          } else {
            imageWrap.prepend(image);
          }
        } else {
          const placeholder = document.createElement("div");
          placeholder.className = "no-image";
          placeholder.textContent = entry.error || "画像がありません";
          imageWrap.prepend(placeholder);
        }

        const body = document.createElement("div");
        body.className = "card-body";
        const name = document.createElement("p");
        name.className = "card-name";
        if (url) {
          const nameLink = createScryfallLink(url);
          nameLink.textContent = displayCard?.name || entry.name;
          nameLink.setAttribute("aria-label", `${nameLink.textContent} をScryfallで開く（新しいタブ）`);
          name.append(nameLink);
        } else {
          name.textContent = displayCard?.name || entry.name;
        }
        body.append(name);

        if (entry.card) {
          const set = document.createElement("p");
          set.className = "card-set";
          set.textContent = entry.card.set || "";
          const type = document.createElement("p");
          type.className = "card-type";
          type.textContent = displayCard.type || "";
          body.append(set, type);
          if (!url) {
            const warning = document.createElement("p");
            warning.className = "card-error";
            warning.textContent = "Scryfallのリンクを取得できませんでした。";
            body.append(warning);
          }
        } else {
          const error = document.createElement("p");
          error.className = "card-error";
          error.textContent = entry.error;
          body.append(error);
        }

        if (entry.card?.image_url && url) body.hidden = true;
        card.append(imageWrap, body);
        return card;
      }

      function scryfallUrl(value) {
        if (typeof value !== "string") return null;
        try {
          const url = new URL(value);
          return url.protocol === "https:" && url.hostname === "scryfall.com" ? url.href : null;
        } catch (error) {
          if (!(error instanceof TypeError)) throw error;
          return null;
        }
      }

      function createScryfallLink(url) {
        const link = document.createElement("a");
        link.className = "card-link";
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        return link;
      }
    </script>
  </body>
</html>
